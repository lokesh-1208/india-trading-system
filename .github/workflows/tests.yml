# Runs the automated checks on GitHub for every pull request and every change
# to main. A pull request shows a green tick when all checks pass and a red
# cross when one fails, so a broken change is caught before it is merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the libraries
        run: pip install -r requirements.txt

      - name: Run the checks
        run: python -m pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the libraries
        run: npm ci

      - name: Check the types and build the page
        run: npm run build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        run: npx playwright test
        env:
          CI: "1"
