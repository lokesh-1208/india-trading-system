# Look of the dashboard, in the style of Zerodha Kite. Two modes are defined.
# Switch between them in the browser: menu at the top right > Settings >
# Choose app theme. The rest of the styling is in trading/ui.py.
[theme.dark]
primaryColor = "#4184f3"
backgroundColor = "#15171b"
secondaryBackgroundColor = "#1e2126"
textColor = "#d5d8dd"

[theme.light]
primaryColor = "#387ed1"
backgroundColor = "#f3f5f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#2f363e"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
